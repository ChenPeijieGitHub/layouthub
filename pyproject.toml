[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "layouthub"
version = "0.1.0"
dependencies = ["gdstk"]

[tool.setuptools]
package-dir = {"" = "src"}
packages = [
    "parser",
    "parser.gds_parser",
    "parser.doe_parser",
    "common",
    "generator",
    "generator.cdl_generator",
]
